# --- ProGuard Configuration for Spring Boot (mine.profile.website) ---

# Specify Java target version
-target 17

# Keep attributes essential for annotations, inner classes, generics, etc.
-keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod,RuntimeVisibleAnnotations,RuntimeInvisibleAnnotations

# Keep the main Spring Boot application class and its main method
-keep public class mine.profile.website.WebsiteApplication {
    public static void main(java.lang.String[]);
}

# Keep all annotations (needed for Spring, JPA, Validation, etc.)
-keep @interface *

# --- Spring Boot Specific Rules ---
-keep class org.springframework.boot.loader.** { *; }
-keep @org.springframework.stereotype.Service class *
-keep @org.springframework.stereotype.Component class *
-keep @org.springframework.stereotype.Repository class *
-keep @org.springframework.stereotype.Controller class *
-keep @org.springframework.web.bind.annotation.RestController class *
-keep @org.springframework.context.annotation.Configuration class *

# Keep methods annotated with common Spring web/bean annotations
-keepclassmembers class * {
    @org.springframework.context.annotation.Bean *;
    @org.springframework.beans.factory.annotation.Autowired *;
    @org.springframework.beans.factory.annotation.Value *;
    @org.springframework.web.bind.annotation.RequestMapping *;
    @org.springframework.web.bind.annotation.GetMapping *;
    @org.springframework.web.bind.annotation.PostMapping *;
    @org.springframework.web.bind.annotation.PutMapping *;
    @org.springframework.web.bind.annotation.DeleteMapping *;
    @org.springframework.web.bind.annotation.PatchMapping *;
    @org.springframework.scheduling.annotation.Scheduled *;
    # Use jakarta equivalents for Spring Boot 3+
    @jakarta.annotation.PostConstruct *;
    @jakarta.annotation.PreDestroy *;
}

# Keep RequestMapping parameter names if they are used implicitly (safer)
-keepclassmembers,allowobfuscation class * {
    @org.springframework.web.bind.annotation.* <methods>;
}

# Keep configuration properties classes
-keep @org.springframework.boot.context.properties.ConfigurationProperties class * {
    <fields>;
    <methods>;
}

# --- JPA / Hibernate Rules ---
# Keep Entity classes in the 'models' package
-keep class mine.profile.website.models.** { *; }
# Keep default constructors for entities (needed by JPA)
-keepclassmembers public class mine.profile.website.models.** {
    public <init>();
}
# Keep enums potentially used in entities/queries
-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}
# Keep JPA Specification classes
-keep class mine.profile.website.Specification.** { *; }


# --- DTO Rules ---
# Keep DTO classes in 'dto' and 'dtos' packages
-keep class mine.profile.website.dto.** { *; }
-keep class mine.profile.website.dtos.** { *; }
# Keep default constructors for DTOs (needed by Jackson/Gson)
-keepclassmembers public class mine.profile.website.dto.** {
    public <init>();
}
-keepclassmembers public class mine.profile.website.dtos.** {
    public <init>();
}

# --- MapStruct Rules ---
# Keep Mapper interfaces in 'mapper' package
-keep class mine.profile.website.mapper.** { *; }
# Keep the generated implementation classes
-keep class mine.profile.website.mapper.**Impl { *; }

# --- Other Application Packages ---
# Keep custom exceptions
-keep class mine.profile.website.exception.** { *; }
# Keep custom formatters (if implementing Spring interfaces, they might need this)
-keep class mine.profile.website.formatter.** { *; }
# Keep utility classes if needed (start without, add if issues)
# -keep class mine.profile.website.util.** { *; }


# --- Jackson Rules (if using complex serialization) ---
-keep class com.fasterxml.jackson.** { *; }
-keep @com.fasterxml.jackson.annotation.JsonIgnoreProperties class *
-keepclassmembers class * {
    @com.fasterxml.jackson.annotation.JsonAnyGetter *;
    @com.fasterxml.jackson.annotation.JsonAnySetter *;
}

# --- Validation Rules ---
-keep class jakarta.validation.** { *; } # Use jakarta namespace

# --- Lombok Rules ---
# ProGuard runs after Lombok. Rules for Entities/DTOs usually cover generated methods.

# --- General Safety Nets ---
-keepclasseswithmembernames,includedescriptorclasses class * {
    native <methods>;
}
-keepclassmembers class * implements java.io.Serializable {
    static final long serialVersionUID;
    private static final java.io.ObjectStreamField[] serialPersistentFields;
    private void writeObject(java.io.ObjectOutputStream);
    private void readObject(java.io.ObjectInputStream);
    java.lang.Object writeReplace();
    java.lang.Object readResolve();
}

# --- Optional: Suppress Warnings ---
# Only add if necessary after testing and confirming warnings are safe to ignore
# -dontwarn org.apache.pdfbox.**
# -dontwarn org.jsoup.**
# -dontwarn com.google.gson.**
# -dontwarn io.jsonwebtoken.**
# -dontwarn org.postgresql.**
# -dontwarn org.hibernate.** # Might be needed depending on Hibernate usage

# Ignore specific warnings if they are known and unavoidable
# -ignorewarnings

# --- Optimization (Optional) ---
# -optimizations !code/simplification/arithmetic,!field/*,!class/merging/*

# --- Final Options ---
-printmapping proguard-mapping.txt
-keepnames class * implements org.springframework.boot.autoconfigure.condition.Condition
-keepparameternames # Keep method parameter names, safer for reflection/frameworks

# Print seeds for debugging what ProGuard kept and why (useful during config development)
# -printseeds seeds.txt