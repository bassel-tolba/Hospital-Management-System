<svg width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="gradientFace" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="#00FFFF"/>  <!-- Cool Cyan Start -->
          <stop offset="50%" stop-color="#FFFFFF"/>  <!-- Bright White Middle -->
          <stop offset="100%"  stop-color="#0000FF"/> <!-- Deep Blue Finish -->
        </linearGradient>
    </defs>

  <!-- Face Outline -->
  <circle cx="75" cy="75" r="60" fill="none" stroke="url(#gradientFace)" stroke-width="6" />

  <!-- Left Eye -->
    <circle cx="50" cy="55" r="8" fill="url(#gradientFace)">
      <animate attributeName="cy" values="55;50;55;50" dur="1.5s" repeatCount="indefinite"/>
    </circle>

  <!-- Right Eye -->
    <circle cx="100" cy="55" r="8" fill="url(#gradientFace)">
        <animate attributeName="cy" values="55;60;55;60" dur="1.5s" repeatCount="indefinite"/>
    </circle>


  <!-- Grinning Mouth -->
    <path d="M 40 100 C 60 120, 90 120, 110 100"
          fill="none"
          stroke="white"
          stroke-width="8"
          stroke-linecap="round"
          stroke-linejoin="round" >
    <animate attributeName="stroke-dasharray" from="0 100" to="100 0" dur="2s" repeatCount="indefinite" />
   <animate attributeName="stroke-width" values="6;8;6;8" dur="2s" repeatCount="indefinite" />
  </path>
 </svg>
